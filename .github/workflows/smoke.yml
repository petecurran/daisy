# daisy starts, plays and jams on Linux, macOS and Windows (headless and muted; see tests/smoke.py).
name: smoke

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Only the test needs Playwright; daisy itself has no dependencies. It drives the Chrome
      # (or Edge) already on the machine, found the same way tools/daisy.py finds it.
      - run: pip install playwright==1.63.0
      - run: python tests/smoke.py
